<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Loja</title>

<style>
body {
    font-family: Arial;
    background: #eee;
    text-align: center;
}

h1 {
    color: #222;
}

.loja {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.produto {
    background: white;
    width: 220px;
    padding: 15px;
    border-radius: 10px;
}

.produto img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.preco {
    color: green;
    font-weight: bold;
}

button {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 10px 20px;
    border-radius: 5px;
}
</style>
</head>

<body>

<h1>Minha Loja</h1>

<div class="loja">

<div class="produto">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
<h2>Tênis</h2>
<p class="preco">R$ 299,90</p>
<button>Comprar</button>
</div>

<div class="produto">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500">
<h2>Relógio</h2>
<p class="preco">R$ 459,90</p>
<button>Comprar</button>
</div>

<div class="produto">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">
<h2>Fone</h2>
<p class="preco">R$ 199,90</p>
<button>Comprar</button>
</div>

<div class="produto">
<img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500">
<h2>Câmera</h2>
<p class="preco">R$ 1.899,90</p>
<button>Comprar</button>
</div>

</div>

</body>
</html>
