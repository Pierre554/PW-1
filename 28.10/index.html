
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Criativo</title>

    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="pagina">

        <section class="painel">
            <div class="icone">✦</div>

            <span class="subtitulo">SEJA BEM-VINDO</span>

            <h1>Seu próximo capítulo começa aqui.</h1>

            <p>
                Crie sua conta e descubra uma nova maneira
                de organizar suas ideias e seus projetos.
            </p>

            <div class="decoracao decoracao1"></div>
            <div class="decoracao decoracao2"></div>

            <span class="rodape-painel">
                ✧ Um novo começo, novas possibilidades.
            </span>
        </section>

        <section class="area-formulario">

            <div class="formulario-container">

                <div class="topo-formulario">
                    <span class="etiqueta">✦ CADASTRO GRATUITO</span>
                    <h2>Crie sua conta</h2>
                    <p>Preencha os dados para começar.</p>
                </div>

                <form id="formulario">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Como podemos te chamar?"
                            required
                            minlength="3"
                        >
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="voce@exemplo.com"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input
                            type="number"
                            id="idade"
                            name="idade"
                            placeholder="Quantos anos você tem?"
                            min="1"
                            max="120"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo de 6 caracteres"
                            minlength="6"
                            required
                        >
                    </div>

                    <label class="termos">
                        <input type="checkbox" id="aceite" required>
                        <span>
                            Concordo com os termos de uso.
                        </span>
                    </label>

                    <button type="submit" class="botao">
                        Criar minha conta <span>→</span>
                    </button>

                    <button type="button" id="preencher" class="botao-secundario">
                        Preencher exemplo
                    </button>

                    <p id="mensagem" role="status" aria-live="polite"></p>

                </form>

                <div class="divisor"></div>

                <p class="texto-final">
                    Feito com criatividade <span>♥</span>
                </p>

            </div>

        </section>

    </main>

</body>
</html>
